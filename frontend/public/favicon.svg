<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C1B"/>
      <stop offset="50%" stop-color="#1A1032"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>
    <linearGradient id="neonBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#neonBolt)" stroke-width="8" stroke-opacity="0.5" />

  <!-- Stylized "TV" Lightning Monogram -->
  <g filter="url(#glow)">
    <!-- Main Lightning TV Path -->
    <path d="M 140 120 L 372 120 L 372 176 L 290 176 L 290 230 L 360 230 L 220 400 L 236 290 L 160 290 L 220 176 L 140 176 Z" 
          fill="url(#neonBolt)" />
    
    <!-- Accent Highlight Cut -->
    <path d="M 372 120 L 340 120 L 210 270 L 270 270 L 190 390 L 350 210 L 270 210 L 340 120 Z" 
          fill="url(#accentGlow)" opacity="0.8" />
  </g>

  <!-- Premium Brand Text Mark -->
  <text x="256" y="455" font-family="'Outfit', 'Space Grotesk', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="12" text-anchor="middle" opacity="0.95">TV</text>
</svg>